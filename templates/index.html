<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto LC79 - Minh Dz</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}

body{
  background:linear-gradient(135deg,#fff5f7 0%,#ffe4ec 50%,#fdf2f8 100%);
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  padding:20px;color:#4a3f4f;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;top:-20%;left:-20%;width:60%;height:60%;
  background:radial-gradient(circle,rgba(244,114,182,0.15) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;bottom:-20%;right:-20%;width:60%;height:60%;
  background:radial-gradient(circle,rgba(251,207,232,0.25) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

/* ===== HOA RƠI ===== */
#petals{
  position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;
}
.petal{
  position:absolute;top:-40px;
  width:14px;height:14px;
  background:radial-gradient(circle at 30% 30%, #fbcfe8, #f472b6);
  border-radius:70% 0 70% 0;
  opacity:.75;
  will-change:transform,opacity;
  animation:fall linear infinite;
  box-shadow:0 0 6px rgba(244,114,182,.35);
}
.petal.small{width:9px;height:9px;opacity:.6}
.petal.big{width:18px;height:18px;opacity:.85}

@keyframes fall{
  0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0;}
  10%{opacity:.9}
  50%{transform:translate3d(40px,50vh,0) rotate(180deg);}
  90%{opacity:.6}
  100%{transform:translate3d(-30px,110vh,0) rotate(360deg);opacity:0;}
}

/* ===== HAMBURGER ===== */
.hamburger{
  position:fixed;top:20px;left:20px;z-index:1001;
  width:48px;height:48px;border-radius:12px;cursor:pointer;
  background:#fff;border:1px solid rgba(244,114,182,0.3);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
  box-shadow:0 4px 20px rgba(244,114,182,.2);transition:.2s;
}
.hamburger:hover{background:#fdf2f8;border-color:#f472b6;transform:translateY(-2px)}
.hamburger span{display:block;width:22px;height:2px;background:#f472b6;border-radius:2px;transition:.3s}
.hamburger.active span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* ===== DRAWER ===== */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(74,63,79,.4);backdrop-filter:blur(4px);
  z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s;
}
.drawer-overlay.show{opacity:1;pointer-events:auto}

.drawer{
  position:fixed;top:0;left:0;height:100vh;width:360px;max-width:90vw;z-index:1002;
  background:#fff;border-right:1px solid rgba(244,114,182,0.2);
  box-shadow:4px 0 40px rgba(244,114,182,.2);
  transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;padding:70px 20px 20px;
}
.drawer.show{transform:translateX(0)}

.drawer-header{
  position:absolute;top:0;left:0;right:0;padding:18px 20px;
  border-bottom:1px solid rgba(244,114,182,0.15);
  background:linear-gradient(180deg,#fff5f7,#fff);
  display:flex;align-items:center;justify-content:space-between;
}
.drawer-header h3{
  font-size:15px;color:#db2777;font-weight:700;letter-spacing:.5px;
}
.drawer-close{
  width:30px;height:30px;border-radius:6px;background:rgba(239,68,68,.1);
  border:1px solid rgba(239,68,68,.25);color:#f87171;cursor:pointer;
  font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;
  transition:.2s;
}
.drawer-close:hover{background:rgba(239,68,68,.2)}

.drawer-section{margin-bottom:22px}
.drawer-section-title{
  font-size:11px;color:#be185d;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.drawer-section-title::before{
  content:'';width:3px;height:12px;background:#f472b6;border-radius:2px;
}

.drawer-field{margin-bottom:12px}
.drawer-field label{
  display:block;font-size:12px;font-weight:600;color:#9d6b8c;margin-bottom:5px;
}
.drawer-field input[type="number"]{
  width:100%;padding:10px 12px;background:#fff5f7;color:#4a3f4f;
  border:1px solid #fbcfe8;border-radius:8px;outline:none;transition:.2s;font-size:13px;
}
.drawer-field input::placeholder{color:#d8b4c8}
.drawer-field input:focus{border-color:#f472b6;box-shadow:0 0 0 3px rgba(244,114,182,.15)}
.drawer-hint{font-size:11px;color:#c084a8;margin-top:4px;font-weight:500}

.saved-indicator{
  display:inline-block;font-size:10px;color:#10b981;font-weight:600;
  margin-left:6px;opacity:0;transition:opacity .3s;
}
.saved-indicator.show{opacity:1}

.btn-apply{
  width:100%;padding:11px;border:none;border-radius:8px;cursor:pointer;
  background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;
  font-weight:700;font-size:13px;transition:.2s;
  box-shadow:0 4px 14px rgba(236,72,153,.3);
}
.btn-apply:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(236,72,153,.45)}
.btn-apply:active{transform:translateY(0)}

/* ===== LOGIN FULL MÀN HÌNH ===== */
.login-container{
  position:relative;z-index:2;
  background:#fff;
  width:100%;
  max-width:720px;
  border-radius:28px;
  padding:64px 56px;
  box-shadow:0 20px 70px rgba(244,114,182,.25),0 0 0 1px rgba(244,114,182,0.18);
  border:1px solid rgba(244,114,182,0.15);
  margin: 6vh auto 4vh;
  min-height: 82vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  animation:loginAppear .6s ease;
}
@keyframes loginAppear{
  from{opacity:0;transform:translateY(30px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.login-container::before{
  content:'';
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:36px;filter:drop-shadow(0 4px 10px rgba(244,114,182,.4));
}
.login-container h2{
  text-align:center;color:#db2777;margin-bottom:10px;font-size:30px;
  letter-spacing:.5px;
}
.login-sub{text-align:center;font-size:14px;color:#c084a8;margin-bottom:38px;font-weight:500;line-height:1.5}

/* ĐỒNG HỒ ĐẾM NGƯỢC */
.timer-box{
  text-align:center;
  margin-bottom: 20px;
  background: rgba(244,114,182,.08);
  border: 1px dashed rgba(244,114,182,.4);
  padding: 10px;
  border-radius: 12px;
  color: #db2777;
  font-weight: 700;
  font-size: 15px;
}
.timer-box span{
  font-size: 18px;
  color: #dc2626;
}

.form-group{margin-bottom:24px}
.form-group label{display:block;font-size:14px;font-weight:700;margin-bottom:10px;color:#9d6b8c;letter-spacing:.3px}
.form-group input{
  width:100%;padding:18px 20px;background:#fff5f7;color:#4a3f4f;
  border:1.5px solid #fbcfe8;border-radius:14px;outline:none;transition:.25s;
  font-size:16px;
}
.form-group input::placeholder{color:#d8b4c8;font-size:15px}
.form-group input:focus{border-color:#f472b6;box-shadow:0 0 0 4px rgba(244,114,182,.18);background:#fff}
.form-group input.key-input{
  border-color:#f9a8d4;background:#fdf2f8;
}
.form-group input.key-input:focus{border-color:#ec4899;box-shadow:0 0 0 4px rgba(236,72,153,.22)}

.btn-login{
  width:100%;padding:18px;background:linear-gradient(135deg,#ec4899,#f472b6);
  color:#fff;border:none;border-radius:14px;font-weight:800;cursor:pointer;
  transition:.25s;box-shadow:0 8px 24px rgba(236,72,153,.35); margin-top: 14px;
  font-size:17px;letter-spacing:.5px;
}
.btn-login:hover{background:linear-gradient(135deg,#db2777,#ec4899);transform:translateY(-2px);box-shadow:0 12px 32px rgba(236,72,153,.5)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}

.tele-contact{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:30px;padding:16px;border-radius:14px;
  background:rgba(244,114,182,.08);border:1px solid rgba(244,114,182,.2);
  color:#db2777;font-weight:700;font-size:14px;text-decoration:none;
  transition:.25s;
}
.tele-contact:hover{background:rgba(244,114,182,.15);border-color:#f472b6;transform:translateY(-2px)}
.tele-contact svg{width:20px;height:20px;fill:#f472b6}

/* ===== MAIN ===== */
.main-wrapper{display:none;width:100%;max-width:900px;flex-direction:column;gap:15px;position:relative;z-index:2; margin-top: 20px;}
.top-header{
  background:#fff;border-radius:16px;padding:15px 25px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 4px 20px rgba(244,114,182,.12);border:1px solid rgba(244,114,182,0.15);
}
.logo-text h1{
  font-size:20px;color:#db2777;font-weight:800;letter-spacing:.5px;margin-bottom:4px;
}
.logo-text p{font-size:13px;color:#c084a8}
.main-card{
  background:#fff;border-radius:20px;padding:25px;
  box-shadow:0 10px 40px rgba(244,114,182,.15);border:1px solid rgba(244,114,182,0.15);
}
.section-title{
  font-size:14px;color:#db2777;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:20px;
}

.status-badges{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
.badge-online{background:rgba(16,185,129,.1);color:#059669;border:1px solid rgba(16,185,129,.3)}
.badge-online.off{background:rgba(239,68,68,.1);color:#dc2626;border-color:rgba(239,68,68,.3)}
.badge-auto{background:rgba(236,72,153,.1);color:#db2777;border:1px solid rgba(236,72,153,.3)}
.badge-auto.off{background:#f3f4f6;color:#9ca3af;border-color:#e5e7eb}
.badge-bet{background:rgba(245,158,11,.1);color:#d97706;border:1px solid rgba(245,158,11,.3)}
.badge-bet.off{background:#f3f4f6;color:#9ca3af;border-color:#e5e7eb}
.badge-bet.active{background:rgba(16,185,129,.12);color:#059669;border-color:rgba(16,185,129,.4)}
.dot{width:6px;height:6px;border-radius:50%;background:#f472b6}
.dot-green{background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.6)}
.dot-red{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.6)}
.dot-gray{background:#9ca3af}
.dot-active{background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.8)}

.prediction-box{
  background:linear-gradient(135deg,#fff5f7 0%,#fdf2f8 100%);
  border:1px solid rgba(244,114,182,0.3);border-radius:16px;padding:20px;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;
  position:relative;overflow:hidden;transition:border-color .3s;
}
.prediction-box::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:3px;
  background:linear-gradient(90deg,transparent,#f472b6,transparent);opacity:.7;
}
.prediction-box.locked{border-color:rgba(251,191,36,.5)}
.prediction-box.locked::before{background:linear-gradient(90deg,transparent,#fbbf24,transparent)}

.pred-left{display:flex;flex-direction:column;gap:5px;z-index:2}
.pred-label{font-size:12px;color:#c084a8;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.pred-label .lock-icon{font-size:10px}
.pred-value{
  font-size:32px;font-weight:800;color:#db2777;letter-spacing:1px;
  transition:.3s;
}
.pred-value.val-tai{color:#2563eb;}
.pred-value.val-xiu{color:#dc2626;}
.pred-value.val-locked{opacity:.8}
.pred-percent{font-size:12px;color:#c084a8;font-weight:500}
.pred-percent.locked{color:#d97706}
.pred-right{text-align:right;z-index:2}
.session-label{font-size:12px;color:#c084a8;font-weight:600;text-transform:uppercase;margin-bottom:4px;display:block;letter-spacing:.5px}
.session-value{font-size:16px;font-weight:800;color:#4a3f4f}

.pred-result-flash{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(16,185,129,0.12);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;z-index:10;animation:fadeIn 0.2s;
  backdrop-filter:blur(4px);
}
.pred-result-flash.lose{background:rgba(239,68,68,0.12)}
.pred-result-flash .text-win{color:#059669}
.pred-result-flash .text-lose{color:#dc2626}
.pred-result-flash small{font-size:14px;font-weight:600;color:#6b7280;margin-top:4px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.pred-result-flash .text-win, .pred-result-flash .text-lose{animation:pulse 0.5s ease}

.info-grid{
  display:grid;grid-template-columns:1fr 1fr;
  border:1px solid rgba(244,114,182,0.2);border-radius:12px;margin-bottom:20px;overflow:hidden;
  background:#fff5f7;
}
.info-item{padding:15px 20px;border-bottom:1px solid rgba(244,114,182,0.12)}
.info-item:nth-child(odd){border-right:1px solid rgba(244,114,182,0.12)}
.info-item:nth-last-child(-n+2){border-bottom:none}
.info-label{font-size:11px;color:#c084a8;font-weight:600;text-transform:uppercase;margin-bottom:6px;display:block;letter-spacing:.5px}
.info-value{font-size:15px;font-weight:700;color:#4a3f4f}
.info-item.highlight{background:rgba(244,114,182,.06)!important}

.action-buttons{display:flex;gap:12px;margin-bottom:25px;flex-wrap:wrap}
.btn-action{
  padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:8px;color:#fff;transition:.2s;
}
.btn-toggle-auto{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 4px 14px rgba(16,185,129,.3)}
.btn-toggle-auto.off{background:linear-gradient(135deg,#ec4899,#f472b6);box-shadow:0 4px 14px rgba(236,72,153,.3)}
.btn-stop-bot{background:linear-gradient(135deg,#ef4444,#f87171);box-shadow:0 4px 14px rgba(239,68,68,.3)}
.btn-action:hover{transform:translateY(-2px);filter:brightness(1.05)}

.table-title{font-size:13px;color:#db2777;font-weight:700;text-transform:uppercase;margin-bottom:15px;letter-spacing:.5px}
.table-wrapper{overflow-x:auto;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th{
  text-align:left;padding:12px 8px;color:#9d6b8c;font-weight:600;
  border-bottom:1px solid rgba(244,114,182,0.2);font-size:11px;text-transform:uppercase;
  background:rgba(244,114,182,.05);letter-spacing:.5px;white-space:nowrap;
}
td{padding:12px 8px;border-bottom:1px solid #fce7f3;font-weight:600;color:#6b7280;white-space:nowrap}
tr:hover td{background:rgba(244,114,182,.04)}
.val-tai{color:#2563eb;}
.val-xiu{color:#dc2626;}
.val-win{color:#059669;}
.val-lose{color:#dc2626;}
.bet-tag{
  display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;
  font-weight:700;margin-left:6px;letter-spacing:.3px;
}
.bet-tag.tai{background:rgba(37,99,235,.12);color:#2563eb;border:1px solid rgba(37,99,235,.25)}
.bet-tag.xiu{background:rgba(220,38,38,.12);color:#dc2626;border:1px solid rgba(220,38,38,.25)}

.toast-wrap{position:fixed;top:80px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{
  padding:12px 16px;border-radius:10px;color:#fff;font-weight:600;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.15);animation:slideIn .3s;backdrop-filter:blur(8px);
}
.toast.success{background:linear-gradient(135deg,rgba(16,185,129,.95),rgba(52,211,153,.95));border:1px solid rgba(52,211,153,.5)}
.toast.error{background:linear-gradient(135deg,rgba(239,68,68,.95),rgba(248,113,113,.95));border:1px solid rgba(248,113,113,.5)}
.toast.info{background:linear-gradient(135deg,rgba(236,72,153,.95),rgba(244,114,182,.95));border:1px solid rgba(244,114,182,.5)}
.toast.warn{background:linear-gradient(135deg,rgba(245,158,11,.95),rgba(251,191,36,.95));border:1px solid rgba(251,191,36,.5)}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}

.spinner{
  display:inline-block;width:12px;height:12px;border:2px solid #fff;
  border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;
  vertical-align:middle;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.balance-update{animation:flashBalance 0.5s ease}
@keyframes flashBalance{0%{background:rgba(52,211,153,.25)}100%{background:transparent}}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#fff5f7}
::-webkit-scrollbar-thumb{background:#fbcfe8;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#f9a8d4}

.force-modal{
  position:fixed;inset:0;background:rgba(74,63,79,.6);backdrop-filter:blur(6px);
  z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;
}
.force-modal.show{display:flex}
.force-modal-box{
  background:#fff;border:1px solid rgba(239,68,68,.3);border-radius:20px;
  padding:30px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.force-modal-box h2{color:#dc2626;font-size:22px;margin-bottom:12px}
.force-modal-box p{color:#6b7280;font-size:14px;margin-bottom:20px;line-height:1.6}
.force-modal-box button{
  padding:12px 24px;border:none;border-radius:10px;cursor:pointer;
  background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;
  font-weight:700;font-size:14px;
}

/* ===== RESPONSIVE ===== */
@media (max-width:768px){
  .login-container{
    padding:44px 28px;
    min-height:auto;
    margin:4vh auto 2vh;
    border-radius:22px;
  }
  .login-container h2{font-size:24px}
  .login-sub{font-size:13px;margin-bottom:28px}
  .form-group input{padding:15px 16px;font-size:15px}
  .btn-login{padding:15px;font-size:15px}
  .toast-wrap{top:70px;right:12px;max-width:calc(100vw - 24px)}
}
</style>
</head>
<body>

<!-- NHẠC NỀN TỰ ĐỘNG -->
<audio id="bgMusic" loop preload="auto" playsinline>
  <source src="https://files.catbox.moe/wdj7mk.mp4" type="audio/mp4">
</audio>

<!-- HOA RƠI -->
<div id="petals"></div>

<div class="toast-wrap" id="toasts"></div>

<div class="force-modal" id="forceModal">
  <div class="force-modal-box">
    <h2 id="forceTitle">🔒 Phiên đã kết thúc</h2>
    <p id="forceMsg">Vui lòng đăng nhập lại.</p>
    <button onclick="location.reload()">ĐĂNG NHẬP LẠI</button>
  </div>
</div>

<!-- NÚT 3 GẠCH -->
<div class="hamburger" id="hamburger" onclick="toggleDrawer()">
  <span></span><span></span><span></span>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>

<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h3>⚙️ CÀI ĐẶT HỆ THỐNG</h3>
    <button class="drawer-close" onclick="toggleDrawer()">×</button>
  </div>

  <div class="drawer-section">
    <div class="drawer-section-title">CƯỢC CỐ ĐỊNH</div>
    <div class="drawer-field">
      <label>Tiền cược mỗi phiên <span class="saved-indicator" id="savedBetAmount">✓ đã lưu</span></label>
      <input type="number" id="betAmount" value="10000" min="1000" step="1000" onchange="onConfigChange()">
      <div class="drawer-hint">Số tiền cố định mỗi phiên</div>
    </div>
  </div>

  <div class="drawer-section">
    <div class="drawer-section-title">CHỐT LÃI TỰ ĐỘNG</div>
    <div class="drawer-field">
      <label>Số tiền lãi muốn chốt <span class="saved-indicator" id="savedTargetProfit">✓ đã lưu</span></label>
      <input type="number" id="targetProfit" value="0" min="0" step="1000" onchange="onConfigChange()">
      <div class="drawer-hint">Đặt 0 để tắt chốt lãi tự động</div>
    </div>
