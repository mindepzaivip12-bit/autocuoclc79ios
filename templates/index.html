<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto LC79 - Minh Dz</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:linear-gradient(135deg,#fff5f7 0%,#ffe4ec 50%,#fdf2f8 100%);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px;color:#4a3f4f;overflow-x:hidden}
body::before{content:'';position:fixed;top:-20%;left:-20%;width:60%;height:60%;background:radial-gradient(circle,rgba(244,114,182,0.15) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-20%;right:-20%;width:60%;height:60%;background:radial-gradient(circle,rgba(251,207,232,0.25) 0%,transparent 70%);pointer-events:none;z-index:0}
#bgMusic { display: none; }

/* 🌸 HOA RƠI (ĐÃ GIẢM SỐ LƯỢNG VÀ KÍCH THƯỚC) */
.flower{position:fixed;top:-50px;pointer-events:none;z-index:999;animation:fall linear forwards;opacity:0.6}
@keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); } 100% { transform: translateY(110vh) rotate(360deg); } }

.hamburger{position:fixed;top:20px;left:20px;z-index:1001;width:48px;height:48px;border-radius:12px;cursor:pointer;background:#fff;border:1px solid rgba(244,114,182,0.3);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;box-shadow:0 4px 20px rgba(244,114,182,.2)}
.hamburger span{display:block;width:22px;height:2px;background:#f472b6;border-radius:2px}
.drawer-overlay{position:fixed;inset:0;background:rgba(74,63,79,.4);backdrop-filter:blur(4px);z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;height:100vh;width:360px;max-width:90vw;z-index:1002;background:#fff;transform:translateX(-100%);transition:transform .3s;overflow-y:auto;padding:70px 20px 20px}
.drawer.show{transform:translateX(0)}
.drawer-header{position:absolute;top:0;left:0;right:0;padding:18px 20px;border-bottom:1px solid #fce7f3;background:#fff;display:flex;justify-content:space-between}
.drawer-header h3{font-size:15px;color:#db2777;font-weight:700}
.drawer-close{border:none;background:transparent;font-size:20px;color:#f87171;cursor:pointer}
.drawer-section{margin-bottom:22px}
.drawer-section-title{font-size:11px;color:#be185d;font-weight:700;margin-bottom:10px}
.drawer-field input{width:100%;padding:10px;background:#fff5f7;border:1px solid #fbcfe8;border-radius:8px;outline:none}
.btn-apply{width:100%;padding:11px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-bottom:10px}
.login-container{position:relative;z-index:1;background:#fff;width:100%;max-width:400px;border-radius:20px;padding:32px;box-shadow:0 10px 40px rgba(244,114,182,.15);margin-top:8vh}
.login-container h2{text-align:center;color:#db2777;margin-bottom:6px}
.login-sub{text-align:center;font-size:12px;color:#c084a8;margin-bottom:22px}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#9d6b8c}
.form-group input{width:100%;padding:12px;background:#fff5f7;border:1px solid #fbcfe8;border-radius:10px;outline:none}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:8px}
.main-wrapper{display:none;width:100%;max-width:900px;flex-direction:column;gap:15px;position:relative;z-index:1;margin-top:20px}
.top-header{background:#fff;border-radius:16px;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(244,114,182,.12)}
.logo-text h1{font-size:20px;color:#db2777;font-weight:800}
.key-expiry-badge{display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff}
.key-expiry-badge.show{display:flex}
.main-card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 10px 40px rgba(244,114,182,.15)}
.section-title{font-size:14px;color:#db2777;font-weight:700;margin-bottom:20px}
.status-badges{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
.badge-online{background:rgba(16,185,129,.1);color:#059669;border:1px solid rgba(16,185,129,.3)}
.badge-online.off{background:rgba(239,68,68,.1);color:#dc2626;border-color:rgba(239,68,68,.3)}
.badge-auto{background:rgba(236,72,153,.1);color:#db2777;border:1px solid rgba(236,72,153,.3)}
.badge-auto.off{background:#f3f4f6;color:#9ca3af}
.badge-bet{background:rgba(245,158,11,.1);color:#d97706;border:1px solid rgba(245,158,11,.3)}
.badge-bet.off{background:#f3f4f6;color:#9ca3af}
.dot{width:6px;height:6px;border-radius:50%;background:#f472b6}
.dot-green{background:#10b981}.dot-red{background:#ef4444}.dot-gray{background:#9ca3af}
.prediction-box{background:linear-gradient(135deg,#fff5f7,#fdf2f8);border:1px solid rgba(244,114,182,0.3);border-radius:16px;padding:20px;display:flex;justify-content:space-between;margin-bottom:15px}
.pred-value{font-size:32px;font-weight:800;color:#db2777}
.pred-value.val-tai{color:#2563eb}.pred-value.val-xiu{color:#dc2626}
.pred-percent{font-size:12px;color:#c084a8}
.info-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #fbcfe8;border-radius:12px;margin-bottom:20px;background:#fff5f7}
.info-item{padding:15px 20px;border-bottom:1px solid #fce7f3}
.info-item:nth-child(odd){border-right:1px solid #fce7f3}
.info-item:nth-last-child(-n+2){border-bottom:none}
.info-label{font-size:11px;color:#c084a8;font-weight:600;margin-bottom:6px;display:block}
.info-value{font-size:15px;font-weight:700}
.info-item.highlight{background:rgba(244,114,182,.06)}
.action-buttons{display:flex;gap:12px;margin-bottom:25px;flex-wrap:wrap}
.btn-action{padding:10px 20px;border:none;border-radius:10px;font-weight:700;cursor:pointer;color:#fff}
.btn-toggle-auto{background:linear-gradient(135deg,#10b981,#34d399)}
.btn-toggle-auto.off{background:linear-gradient(135deg,#ec4899,#f472b6)}
.btn-stop-bot{background:linear-gradient(135deg,#ef4444,#f87171)}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th{text-align:left;padding:12px 8px;color:#9d6b8c;border-bottom:1px solid #fce7f3;font-size:11px}
td{padding:12px 8px;border-bottom:1px solid #fce7f3;font-weight:600;color:#6b7280}
.toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:10px;color:#fff;font-weight:600;font-size:13px;animation:slideIn .3s}
.toast.success{background:#10b981}.toast.error{background:#ef4444}.toast.info{background:#ec4899}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>
<audio id="bgMusic" loop preload="auto"><source src="https://files.catbox.moe/wdj7mk.mp4" type="audio/mp4"></audio>
<div class="toast-wrap" id="toasts"></div>
<div class="hamburger" onclick="toggleDrawer()"><span></span><span></span><span></span></div>
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header"><h3>⚙️ CÀI ĐẶT</h3><button class="drawer-close" onclick="toggleDrawer()">×</button></div>
  <div class="drawer-section">
    <div class="drawer-section-title">CƯỢC</div>
    <div class="drawer-field"><input type="number" id="betAmount" value="10000" onchange="onConfigChange()"></div>
  </div>
  <div class="drawer-section">
    <button class="btn-apply" style="background:rgba(239,68,68,.12);color:#dc2626;border:1px solid rgba(239,68,68,.25)" onclick="resetHistory()">🗑 XOÁ LỊCH SỬ</button>
    <button class="btn-apply" style="background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb" onclick="logout()">🚪 ĐĂNG XUẤT</button>
  </div>
</div>
<div class="login-container" id="loginView">
  <h2>ĐĂNG NHẬP</h2>
  <div class="form-group"><label>Tài khoản</label><input type="text" id="username"></div>
  <div class="form-group"><label>Mật khẩu</label><input type="password" id="password"></div>
  <div class="form-group"><label>KEY</label><input type="text" id="accessKey" onkeydown="if(event.key==='Enter')handleLogin()"></div>
  <button class="btn-login" id="btnLogin" onclick="handleLogin()">ĐĂNG NHẬP</button>
</div>
<div class="main-wrapper" id="mainView">
  <div class="top-header"><div class="logo-text"><h1>AUTO LC79</h1></div><div class="key-expiry-badge" id="keyExpiryBadge"><span>🔑</span><strong id="keyExpiryText"></strong></div></div>
  <div class="main-card">
    <div class="status-badges">
      <div class="badge badge-online off" id="socketBadge"><div class="dot dot-gray"></div> Socket: OFF</div>
      <div class="badge badge-auto off" id="autoStatusBadge"><div class="dot dot-gray"></div> AUTO: OFF</div>
    </div>
    <div class="prediction-box"><div><span class="pred-label">DỰ ĐOÁN</span><div class="pred-value" id="predValue">—</div><div class="pred-percent" id="predPercent"></div></div><div style="text-align:right"><span class="session-label">PHIÊN</span><div class="session-value" id="sessionValue">#</div></div></div>
    <div class="info-grid">
      <div class="info-item"><span class="info-label">NICKNAME</span><div class="info-value" id="nicknameDisplay">—</div></div>
      <div class="info-item"><span class="info-label">SỐ DƯ</span><div class="info-value" id="balanceDisplay">0</div></div>
      <div class="info-item"><span class="info-label">CƯỢC PHIÊN</span><div class="info-value" id="betDisplay">0</div></div>
      <div class="info-item highlight"><span class="info-label">CHỐT LÃI</span><div class="info-value" id="plDisplay">0</div></div>
      <div class="info-item"><span class="info-label">WIN / LOSE</span><div class="info-value"><span style="color:#059669" id="winCount">0</span> / <span style="color:#dc2626" id="loseCount">0</span></div></div>
      <div class="info-item"><span class="info-label">TRẠNG THÁI</span><div class="info-value" id="statusText">Chờ...</div></div>
    </div>
    <div class="action-buttons">
      <button class="btn-action btn-toggle-auto off" id="btnToggleAuto" onclick="toggleAuto()">▶ BẬT AUTO</button>
      <button class="btn-action btn-stop-bot" onclick="stopBot()">⛔ NGẮT BOT</button>
    </div>
    <div class="table-title">LỊCH SỬ</div>
    <div class="table-wrapper">
      <table><thead><tr><th>PHIÊN</th><th>CỬA</th><th>CƯỢC</th><th>KẾT QUẢ</th><th>WIN/LOSE</th></tr></thead><tbody id="historyBody"></tbody></table>
    </div>
  </div>
</div>
<script>
let socket=null, autoOn=false, mySid=null, keyTimer=null;
const music = document.getElementById('bgMusic'); music.volume = 0.35; music.play().catch(()=>{ document.body.addEventListener('click',()=>music.play(),{once:true}); });

// Giảm tần suất hoa rơi xuống 1.2 giây/bông
function createFlower(){ const f=document.createElement('div'); f.className='flower'; f.innerHTML=['🌸','🌺','🌼'][Math.floor(Math.random()*3)]; f.style.left=Math.random()*100+'vw'; f.style.animationDuration=(6+Math.random()*4)+'s'; f.style.fontSize=(10+Math.random()*10)+'px'; document.body.appendChild(f); setTimeout(()=>f.remove(), 10000); }
setInterval(createFlower, 1200); 

function toast(msg,type='info'){ const el=document.createElement('div'); el.className='toast '+type; el.innerText=msg; document.getElementById('toasts').appendChild(el); setTimeout(()=>el.remove(),3500); }
function toggleDrawer(){ document.getElementById('drawer').classList.toggle('show'); document.getElementById('drawerOverlay').classList.toggle('show'); }
function setKeyExpiry(ts){ if(!ts)return; const t=document.getElementById('keyExpiryText'); const exp=Number(ts)*(String(ts).length<=10?1000:1); const d=new Date(exp); t.innerText=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} - ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; document.getElementById('keyExpiryBadge').classList.add('show'); }

async function handleLogin(){
  const u=document.getElementById('username').value.trim(), p=document.getElementById('password').value.trim(), k=document.getElementById('accessKey').value.trim();
  if(!u||!p) return toast('Nhập tài khoản/mật khẩu','error');
  const btn=document.getElementById('btnLogin'); btn.disabled=true; btn.innerText='Đang đăng nhập...';
  try{
    const r=await fetch('/api/login',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p, key:k})});
    const d=await r.json();
    if(!d.success){ toast(d.error||'Lỗi','error'); btn.disabled=false; btn.innerText='ĐĂNG NHẬP'; return; }
    mySid=d.sid; document.getElementById('loginView').style.display='none'; document.getElementById('mainView').style.display='flex';
    document.getElementById('nicknameDisplay').innerText=d.nickname; document.getElementById('balanceDisplay').innerText=Number(d.balance).toLocaleString();
    if(d.license_expires_at) setKeyExpiry(d.license_expires_at);
    connectSocket(mySid); toast('Thành công!','success'); setTimeout(pollStats,500);
  }catch(e){ toast('Lỗi kết nối','error'); btn.disabled=false; btn.innerText='ĐĂNG NHẬP'; }
}

function connectSocket(sid){
  if(socket) socket.disconnect();
  socket=io(window.location.origin,{transports:['websocket','polling'],reconnection:true,reconnectionAttempts:Infinity});
  socket.on('connect',()=>{ setTimeout(pollStats,300); });
  socket.on('session_update',d=>{ document.getElementById('sessionValue').innerText='#'+d.session_id; const p=document.getElementById('predValue'); if(d.prediction){ p.innerText=d.prediction; p.className='pred-value '+(d.prediction.startsWith('T')?'val-tai':'val-xiu'); } });
  socket.on('result_update',d=>{ if(d.balance) document.getElementById('balanceDisplay').innerText=Number(d.balance).toLocaleString(); if(d.profit_loss!==undefined){ const pl=document.getElementById('plDisplay'); pl.innerText=(d.profit_loss>=0?'+':'')+Number(d.profit_loss).toLocaleString(); pl.style.color=d.profit_loss>=0?'#059669':'#dc2626'; } if(d.history) renderHistory(d.history); });
  socket.on('stats_update',s=>applyState(s));
  socket.on('toast',d=>toast(d.msg,d.type));
}

async function pollStats(){ try{ const r=await fetch('/api/stats'); const d=await r.json(); if(d.success && d.state) applyState(d.state); }catch(e){} }

function applyState(s){
  if(!s) return; autoOn=!!s.auto_bet_enabled;
  const sb=document.getElementById('socketBadge');
  if(s.socket_connected){ sb.className='badge badge-online'; sb.innerHTML='<div class="dot dot-green"></div> Socket: ON'; document.getElementById('statusText').innerText='Đã kết nối'; document.getElementById('statusText').style.color='#059669'; }
  else { sb.className='badge badge-online off'; sb.innerHTML='<div class="dot dot-red"></div> Socket: OFF'; document.getElementById('statusText').innerText='Đang kết nối...'; document.getElementById('statusText').style.color='#d97706'; }
  const btn=document.getElementById('btnToggleAuto'), badge=document.getElementById('autoStatusBadge');
  if(autoOn){ btn.innerHTML='⏸ TẮT AUTO'; btn.classList.remove('off'); badge.className='badge badge-auto'; badge.innerHTML='<div class="dot dot-green"></div> AUTO: ON'; }
  else{ btn.innerHTML='▶ BẬT AUTO'; btn.classList.add('off'); badge.className='badge badge-auto off'; badge.innerHTML='<div class="dot dot-gray"></div> AUTO: OFF'; }
  if(s.balance!==undefined) document.getElementById('balanceDisplay').innerText=Number(s.balance).toLocaleString();
  if(s.profit_loss!==undefined){ const pl=document.getElementById('plDisplay'); pl.innerText=(s.profit_loss>=0?'+':'')+Number(s.profit_loss).toLocaleString(); pl.style.color=s.profit_loss>=0?'#059669':'#dc2626'; }
  document.getElementById('winCount').innerText=s.win_count||0; document.getElementById('loseCount').innerText=s.lose_count||0;
  document.getElementById('betDisplay').innerText=(s.current_bet||0).toLocaleString();
  if(s.session_id) document.getElementById('sessionValue').innerText='#'+s.session_id;
  if(s.history) renderHistory(s.history);
}

function renderHistory(rows){ const tb=document.getElementById('historyBody'); tb.innerHTML=''; if(!rows||!rows.length){tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:#d8b4c8;padding:20px">Chưa có lịch sử</td></tr>';return;} rows.forEach(r=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>#${r.session}</td><td>${r.pred||'—'}</td><td>${Number(r.bet||0).toLocaleString()}</td><td>${r.result||'—'}</td><td>${r.win===true?'<span style="color:#059669">✓ THẮNG</span>':r.win===false?'<span style="color:#dc2626">✗ THUA</span>':'—'}</td>`; tb.appendChild(tr); }); }

async function toggleAuto(){ const newVal=!autoOn; await fetch('/api/config',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({auto_bet_enabled:newVal})}); toast(newVal?'Bật Auto':'Tắt Auto',newVal?'success':'info'); pollStats(); }
async function stopBot(){ await fetch('/api/config',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({auto_bet_enabled:false})}); toast('Đã ngắt Bot','error'); pollStats(); }
async function onConfigChange(){ const amt=parseInt(document.getElementById('betAmount').value)||10000; await fetch('/api/config',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({betAmount:amt})}); toast('Đã lưu','success'); }
async function resetHistory(){ if(!confirm('Xoá lịch sử?'))return; await fetch('/api/config',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({reset_history:true})}); toast('Đã xoá','success'); pollStats(); }
async function logout(){ if(!confirm('Đăng xuất?'))return; try{await fetch('/api/logout',{method:'POST'});}catch(e){} location.reload(); }
setInterval(()=>{if(socket&&socket.connected) pollStats();},3000);
</script>
</body>
</html>
